<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ImageMap – Bild als Karten-Wand</title>
<style>
:root{
  --bg:#eef0eb; --panel:#fbfbf8; --ink:#1b2a2f; --muted:#5a6b70; --line:#cdd3cc;
  --accent:#23698a; --accent-ink:#ffffff; --grid:rgba(35,105,138,.85); --err:#a63a2b; --ok:#2f7d4f;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14201f; --panel:#1c2b2a; --ink:#e6eee9; --muted:#9db1ac;
    --line:#364b49; --accent:#5db6d8; --accent-ink:#0c1a1d; --grid:rgba(93,182,216,.9); --err:#ff8c7a; --ok:#7fd69c;
  }
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:1060px;margin:0 auto;padding:28px 18px 48px}
h1{font-size:1.9rem;line-height:1.15;margin:0 0 6px;font-weight:700;letter-spacing:-.01em}
.lead{color:var(--muted);margin:0 0 24px;max-width:60ch}
.layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:820px){.layout{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px}
.stage{display:grid;place-items:center;min-height:300px;overflow:hidden;position:relative}
.stage canvas{max-width:100%;height:auto;display:block;image-rendering:auto}
.drop{display:grid;gap:8px;place-items:center;text-align:center;width:100%;min-height:260px;border:2px dashed var(--line);border-radius:8px;padding:20px;cursor:pointer;color:var(--muted)}
.drop:hover,.drop.over,.drop:focus-visible{border-color:var(--accent);color:var(--ink);outline:none}
.drop strong{color:var(--ink);font-size:1.05rem}
label{display:block;font-weight:600;margin-bottom:4px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
input[type=number],select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
input:focus-visible,select:focus-visible,button:focus-visible,.check input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.check{display:flex;gap:10px;align-items:flex-start;margin:0 0 12px;font-weight:400}
.check input{margin-top:5px;accent-color:var(--accent)}
.check small{display:block;color:var(--muted)}
.hint{color:var(--muted);font-size:.9rem;margin:0 0 14px}
button{font:inherit;font-weight:600;border:0;border-radius:6px;padding:11px 16px;cursor:pointer;background:var(--accent);color:var(--accent-ink);width:100%}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);width:auto;padding:7px 12px}
button:disabled{opacity:.5;cursor:not-allowed}
.msg{margin:14px 0 0;padding:10px 12px;border-radius:6px;border:1px solid var(--line)}
.msg.err{border-color:var(--err);color:var(--err)}
.msg.ok{border-color:var(--ok)}
.cmd{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:8px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
code{font:600 1.05rem ui-monospace,Menlo,Consolas,monospace;word-break:break-all}
.size{color:var(--muted);font-size:.9rem;margin:-6px 0 14px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <h1>Bild als Karten-Wand</h1>
  <p class="lead" id="who">Wähle ein Bild, stelle die Größe ein und lade es hoch. Du bekommst danach einen Befehl für den Minecraft-Chat.</p>

  <div id="fatal" class="msg err" hidden></div>

  <div class="layout" id="app" hidden>
    <section class="panel stage" aria-label="Vorschau">
      <div class="drop" id="drop" tabindex="0" role="button" aria-label="Bild auswählen">
        <strong>Bild hier ablegen oder auswählen</strong>
        <span>PNG, JPG, GIF oder WebP von deinem Gerät</span>
      </div>
      <canvas id="preview" hidden></canvas>
      <input type="file" id="file" accept="image/*" hidden>
    </section>

    <section class="panel" aria-label="Einstellungen">
      <div class="row">
        <div><label for="w">Breite (Karten)</label><input type="number" id="w" min="1" value="4"></div>
        <div><label for="h">Höhe (Karten)</label><input type="number" id="h" min="1" value="3"></div>
      </div>
      <p class="size" id="size"></p>

      <label class="check"><input type="checkbox" id="ratio" checked><span>Seitenverhältnis beibehalten</span></label>

      <div style="margin-bottom:14px">
        <label for="fit">Anpassung</label>
        <select id="fit">
          <option value="cover">Füllen (Rand wird beschnitten)</option>
          <option value="contain">Einpassen (leere Ränder)</option>
          <option value="stretch">Strecken</option>
        </select>
      </div>

      <label class="check"><input type="checkbox" id="auto" checked><span>Automatisch platzieren
        <small>Du setzt nur die Karte oben links ein, der Rest folgt nach rechts und unten.</small></span></label>
      <label class="check"><input type="checkbox" id="hd"><span>HD-Modus
        <small>Dithering für feinere Farbverläufe. Dauert beim Hochladen etwas länger.</small></span></label>

      <button id="send" disabled>Bild hochladen</button>
      <div id="status" class="msg" hidden></div>

      <div id="result" hidden>
        <p class="hint" style="margin-top:16px">Gib diesen Befehl im Minecraft-Chat ein:</p>
        <div class="cmd"><code id="cmd"></code><button class="ghost" id="copy">Kopieren</button></div>
      </div>
    </section>
  </div>
</main>

<script>
(function(){
  var P = new URLSearchParams(location.search);
  var token = P.get('token');
  var API = (P.get('api') || '').replace(/\/+$/, '');
  var $ = function(id){ return document.getElementById(id); };
  var maxAxis = 16, img = null, busy = false;

  function fatal(t){ var f=$('fatal'); f.textContent=t; f.hidden=false; $('app').hidden=true; }
  function status(t, cls){ var s=$('status'); s.textContent=t; s.className='msg '+(cls||''); s.hidden=!t; }

  if (!token) { fatal('Es fehlt der Token. Gib im Spiel /imagemap upload ein und öffne den Link, den du bekommst.'); return; }
  if (location.protocol === 'https:' && API.indexOf('http:') === 0) {
    fatal('Diese HTTPS-Seite darf keinen unverschlüsselten Server ansprechen. Nutze den http-Link aus dem Spiel oder stelle auf dem Server einen HTTPS-Proxy bereit.'); return;
  }

  fetch(API + '/api/session?token=' + encodeURIComponent(token))
    .then(function(r){ return r.json().then(function(j){ if(!r.ok) throw new Error(j.error||'Fehler'); return j; }); })
    .then(function(j){
      maxAxis = j.max;
      $('w').max = maxAxis; $('h').max = maxAxis;
      $('who').textContent = 'Hallo ' + j.player + '! Wähle ein Bild, stelle die Größe ein und lade es hoch.';
      $('app').hidden = false;
    })
    .catch(function(e){ fatal(e.message === 'Failed to fetch' ? 'Der Minecraft-Server ist nicht erreichbar (Port offen? Adresse in der config.yml korrekt?).' : e.message); });

  function clampDim(v){ v = Math.round(+v) || 1; return Math.max(1, Math.min(maxAxis, v)); }

  function compose(){
    var W = clampDim($('w').value)*128, H = clampDim($('h').value)*128;
    var c = document.createElement('canvas'); c.width = W; c.height = H;
    var g = c.getContext('2d');
    g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high';
    var fit = $('fit').value, iw = img.naturalWidth, ih = img.naturalHeight;
    if (fit === 'stretch') g.drawImage(img, 0, 0, W, H);
    else {
      var s = (fit === 'cover' ? Math.max : Math.min)(W/iw, H/ih);
      var dw = iw*s, dh = ih*s;
      g.drawImage(img, (W-dw)/2, (H-dh)/2, dw, dh);
    }
    return c;
  }

  function render(){
    if (!img) return;
    var c = compose(), p = $('preview'), g;
    p.width = c.width; p.height = c.height;
    g = p.getContext('2d');
    g.fillStyle = '#000'; g.fillRect(0,0,c.width,c.height);
    g.drawImage(c,0,0);
    // Rahmenraster: jede Zelle ist ein Item Frame
    g.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--grid').trim() || '#2b6f8f';
    g.lineWidth = Math.max(2, c.width/400);
    for (var x=128; x<c.width; x+=128){ g.beginPath(); g.moveTo(x,0); g.lineTo(x,c.height); g.stroke(); }
    for (var y=128; y<c.height; y+=128){ g.beginPath(); g.moveTo(0,y); g.lineTo(c.width,y); g.stroke(); }
    $('preview').hidden = false; $('drop').hidden = true;
    var w = clampDim($('w').value), h = clampDim($('h').value);
    $('size').textContent = w*h + ' Karten · ' + (w*128) + ' × ' + (h*128) + ' Pixel';
    $('send').disabled = busy;
  }

  function load(file){
    if (!file || file.type.indexOf('image/') !== 0) { status('Das ist keine Bilddatei.', 'err'); return; }
    var url = URL.createObjectURL(file), i = new Image();
    i.onload = function(){
      img = i; status('');
      var w = clampDim($('w').value);
      $('h').value = clampDim(w * i.naturalHeight / i.naturalWidth);
      render();
    };
    i.onerror = function(){ status('Das Bild konnte nicht gelesen werden.', 'err'); };
    i.src = url;
  }

  $('drop').addEventListener('click', function(){ $('file').click(); });
  $('drop').addEventListener('keydown', function(e){ if (e.key==='Enter'||e.key===' ') { e.preventDefault(); $('file').click(); } });
  $('preview').addEventListener('click', function(){ $('file').click(); });
  $('file').addEventListener('change', function(){ load(this.files[0]); });
  ['dragover','dragenter'].forEach(function(n){ $('drop').addEventListener(n, function(e){ e.preventDefault(); this.classList.add('over'); }); });
  ['dragleave','drop'].forEach(function(n){ $('drop').addEventListener(n, function(e){ e.preventDefault(); this.classList.remove('over'); }); });
  $('drop').addEventListener('drop', function(e){ load(e.dataTransfer.files[0]); });

  $('w').addEventListener('input', function(){
    if (img && $('ratio').checked) $('h').value = clampDim(clampDim(this.value) * img.naturalHeight / img.naturalWidth);
    render();
  });
  $('h').addEventListener('input', function(){
    if (img && $('ratio').checked) $('w').value = clampDim(clampDim(this.value) * img.naturalWidth / img.naturalHeight);
    render();
  });
  $('fit').addEventListener('change', render);

  $('send').addEventListener('click', function(){
    if (!img || busy) return;
    busy = true; $('send').disabled = true; status('Bild wird verarbeitet und hochgeladen …');
    var w = clampDim($('w').value), h = clampDim($('h').value);
    compose().toBlob(function(blob){
      var qs = '?token=' + encodeURIComponent(token) + '&w=' + w + '&h=' + h +
               '&auto=' + ($('auto').checked ? 1 : 0) + '&hd=' + ($('hd').checked ? 1 : 0);
      fetch(API + '/api/upload' + qs, { method:'POST', headers:{'Content-Type':'image/png'}, body: blob })
        .then(function(r){ return r.json().then(function(j){ if(!r.ok) throw new Error(j.error||'Upload fehlgeschlagen'); return j; }); })
        .then(function(j){
          status('Hochgeladen. Der Link ist jetzt verbraucht.', 'ok');
          $('cmd').textContent = j.command; $('result').hidden = false;
          $('send').disabled = true; $('send').textContent = 'Fertig';
        })
        .catch(function(e){ busy = false; $('send').disabled = false; status(e.message, 'err'); });
    }, 'image/png');
  });

  $('copy').addEventListener('click', function(){
    var t = $('cmd').textContent, b = this;
    (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(function(){ b.textContent = 'Kopiert'; })
      .catch(function(){ var r=document.createRange(); r.selectNodeContents($('cmd')); getSelection().removeAllRanges(); getSelection().addRange(r); });
  });
})();
</script>
</body>
</html>
