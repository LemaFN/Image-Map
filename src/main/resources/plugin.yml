name: ImageMap-Claude
main: de.imagemapclaude.ImageMapPlugin
version: '${version}'
api-version: '26.1'
description: Bilder per Webseite hochladen und automatisch als Karten-Wand platzieren
commands:
  imagemap:
    description: Bilder als Karten-Wand platzieren
    usage: /imagemap upload
    aliases: [im]
    permission: imagemap.use
permissions:
  imagemap.use:
    description: Bilder hochladen und eigene Bilder abrufen
    default: op
  imagemap.admin:
    description: Auch Bilder anderer Spieler abrufen
    default: op
